name: Build and deploy resume

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume-deploy
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compile resume
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume.tex
          latexmk_use_lualatex: true

      - name: Prepare deployment
        run: |
          mkdir -p public
          cp resume.pdf public/resume.pdf

      - name: Publish PDF
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deployments
          publish_dir: ./public
          force_orphan: true
          full_commit_message: Deploy resume from ${{ github.sha }}
